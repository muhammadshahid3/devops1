apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: docslot

resources:
  - namespace.yaml
  - external-secret.yaml
  - backend/configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml

images:
  - name: doctor-appointment-booking-backend
    newName: shahiddevops1/doctor-appointment-booking-backend
    newTag: v2
  - name: doctor-appointment-booking-frontend
    newName: shahiddevops1/doctor-appointment-booking-frontend
    newTag: v2
