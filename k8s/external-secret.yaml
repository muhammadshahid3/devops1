# AWS Secrets Manager ("mediconnect/rds/mysql") -> K8s Secret "app-secret"
# Keys: DB_CONNECTION, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
# Pehle ClusterSecretStore "aws-secrets-manager" cluster mein hona chahiye
# (terraform repo: k8s-examples/cluster-secret-store.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mediconnect/rds/mysql
