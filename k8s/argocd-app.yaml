apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docslot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/muhammadshahid3/devops1
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: docslot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
